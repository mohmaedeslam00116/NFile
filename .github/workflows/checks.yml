name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analysis and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: the analysis depends on the SDK, and a gate that changes with
          # the newest release is a gate that breaks without anyone changing code.
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check that the translation is up to date
        # The class of the translation is written by the tool of Flutter from
        # the ARB files. It is committed, so that the analysis and the tests
        # always have it; this step says that it still matches the files it
        # was written from.
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: Run the static analysis
        run: flutter analyze

      - name: Run the tests
        run: flutter test
